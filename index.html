<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Qadam — a serene, anti-overwhelm, local-first task manager. Zero guilt, zero clutter." />
    <meta name="theme-color" content="#3B82F6" />
    <meta name="color-scheme" content="light dark" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Qadam" />
    <title>Qadam — قدم</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('qadam.theme') || 'system';
          var dark =
            stored === 'dark' ||
            (stored === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', !!dark);
        } catch (e) {
          /* localStorage unavailable — leave defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Qadam needs JavaScript to run — it is a fully offline, local-first app.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
